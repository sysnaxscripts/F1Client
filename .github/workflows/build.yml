name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        id: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build log
        if: always()
        run: |
          tail -c 400000 /tmp/build.log > /tmp/build.tail.log || true
          python3 .github/scripts/emit.py build /tmp/build.tail.log 28

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f1client
          path: build/libs/*.jar

  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava > /tmp/prep.log 2>&1 || true
          find . ~/.gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft|fabric-api|fabric-rendering|fabric-lifecycle' | head -80 > /tmp/jars.txt
          tail -50 /tmp/prep.log >> /tmp/jars.txt
      - name: Report jars
        if: always()
        run: python3 .github/scripts/emit.py jars /tmp/jars.txt 5
      - name: Javap A
        if: always()
        run: |
          JAR=$(find . ~/.gradle -name '*.jar' 2>/dev/null | grep -E 'minecraft-merged|minecraft-client' | grep -v sources | grep -i yarn | head -1)
          echo "jar=$JAR" > /tmp/javap_a.txt
          javap -p -cp "$JAR" $(sed -n '1,45p' .github/scripts/classes.txt | tr '\n' ' ') >> /tmp/javap_a.txt 2>&1 || true
          python3 .github/scripts/emit.py javapA /tmp/javap_a.txt 30
      - name: Javap B
        if: always()
        run: |
          JAR=$(find . ~/.gradle -name '*.jar' 2>/dev/null | grep -E 'minecraft-merged|minecraft-client' | grep -v sources | grep -i yarn | head -1)
          echo "jar=$JAR" > /tmp/javap_b.txt
          javap -p -cp "$JAR" $(sed -n '46,200p' .github/scripts/classes.txt | tr '\n' ' ') >> /tmp/javap_b.txt 2>&1 || true
          python3 .github/scripts/emit.py javapB /tmp/javap_b.txt 30
