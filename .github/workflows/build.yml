name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom resolves the Mojang mappings and the Minecraft jar from Mojang's and
      # Fabric's own repositories, so a first build downloads more than a Yarn build.
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build-log.txt

      # The interesting part of the log, committed back to the branch, so it can be read
      # without access to the Actions log and artifact storage.
      - name: Report failures into the branch
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p build-report
          grep -nE "error:|warning:|FAILURE|What went wrong|Caused by|Could not|Execution failed|Mixin apply|mixin|\.java:[0-9]+" build-log.txt \
            | tail -n 400 > build-report/last-failure.txt || true
          {
            echo "# Last failed build"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit under test: $GITHUB_SHA"
            echo
            echo '```'
            cat build-report/last-failure.txt
            echo '```'
          } > build-report/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report
          if ! git diff --cached --quiet; then
            git commit -m "Report build failure [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f1
          path: build/libs/*.jar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
