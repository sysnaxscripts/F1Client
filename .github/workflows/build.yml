name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom resolves the Mojang mappings and the Minecraft jar from Mojang's and
      # Fabric's own repositories, so a first build downloads more than a Yarn build.
      # pipefail matters: without it the pipeline returns tee's status, a failed compile
      # looks like a green build, the jar upload finds nothing and the report below is
      # skipped because failure() is false.
      - name: Build
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build-log.txt

      # Runs after the build (which resolves and generates the mapped Minecraft jar) and
      # even when it failed, so a name that does not exist in this version can be looked
      # up in the report below instead of guessed at.
      - name: Probe the mapped API
        if: always()
        run: |
          chmod +x ./gradlew
          ./gradlew probeApi --stacktrace > probe-log.txt 2>&1 || true
          tail -n 40 probe-log.txt

      # Committed back to the branch on failure only, so a broken build can be diagnosed
      # without access to the Actions log and artifact storage. The commit message is marked
      # so it does not retrigger this workflow; a green build uploads artifacts instead and
      # leaves the branch alone.
      - name: Report the failed build into the branch
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p build-report
          {
            echo "# Last build"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit under test: $GITHUB_SHA"
            echo "Generated on: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## build/libs"
            echo
            echo '```'
            ls -l build/libs 2>&1 || echo "no build/libs directory"
            echo '```'
            echo
            echo "## Mapped API probe"
            echo
            echo '```'
            cat build/probe-api.txt 2>&1 || echo "no probe output"
            echo '```'
            echo
            echo "## Probe task log"
            echo
            echo '```'
            tail -n 40 probe-log.txt 2>&1 || echo "no probe log"
            echo '```'
            echo
            echo "## Compile errors, with the symbol and location lines javac prints under each"
            echo
            echo '```'
            grep -nE -A4 "error:" build-log.txt | head -n 500 || echo "no compile errors"
            echo '```'
            echo
            echo "## Gradle output (filtered)"
            echo
            echo '```'
            grep -nE "error:|warning:|FAILURE|What went wrong|Caused by|Could not|Execution failed|Mixin|\.java:[0-9]+|^> Task|BUILD (SUCCESSFUL|FAILED)" build-log.txt \
              | tail -n 300 || true
            echo '```'
            echo
            echo "## Gradle output (tail)"
            echo
            echo '```'
            tail -n 120 build-log.txt
            echo '```'
          } > build-report/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report
          if ! git diff --cached --quiet; then
            git commit -m "Report build result (skip ci)"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f1
          path: build/libs/*.jar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
