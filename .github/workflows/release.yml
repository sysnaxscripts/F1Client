name: release

# Publishing a GitHub release builds the mod at the release tag and attaches the
# mod jar and a zip of the source tree to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Pack the source tree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: git archive --format=zip --prefix="F1Client-${TAG}-source/" -o "F1Client-${TAG}-source.zip" HEAD

      - name: Attach the jar and the source zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release upload "$TAG" "$JAR" "F1Client-${TAG}-source.zip" --clobber
