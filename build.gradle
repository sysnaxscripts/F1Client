plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Mojang mappings. Unlike Yarn these are pulled from Mojang's and Fabric's own
	// repositories (libraries.minecraft.net, maven.fabricmc.net), which Loom adds itself.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MixinExtras supplies @ModifyArgs' Args, @Local and the other sugar used by
	// CameraMixin. compileOnly + annotationProcessor is enough to build against it; the
	// `include` line is what the spec asks for and nests it in the jar. Fabric Loader
	// 0.16+ already bundles MixinExtras, so if the game ever reports a duplicate or a
	// conflicting MixinExtras at runtime, drop the `include` line and keep the other two.
	compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	include "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"

	testImplementation "junit:junit:4.13.2"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["-Xmaxerrs", "2000"])
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnit()
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// Development aid: prints the signatures of the mapped Minecraft classes whose names this
// mod depends on but cannot verify offline. Run `./gradlew probeApi`, optionally with
// -PprobePattern='Gizmo' or -PprobeDumpPattern='Camera', and read build/probe-api.txt.
// CI folds that file into build-report/README.md, which is how the mapping notes in the
// README stay honest. It deliberately does not depend on compiling, so it still reports
// when the build is broken.
tasks.register("probeApi") {
	def listPattern = (project.findProperty("probePattern") ?: 'gizmo|debug|minecart|render').toString()
	// Dumping is limited to a narrow pattern: javap output for every rendering class would
	// be megabytes.
	def dumpPattern = (project.findProperty("probeDumpPattern") ?: 'gizmo|minecart|client.Camera|LevelRenderer').toString()
	outputs.upToDateWhen { false }
	doLast {
		def out = layout.buildDirectory.file("probe-api.txt").get().asFile
		out.text = ""
		def jars = []
		try {
			jars.addAll(files(loom.minecraftJarProvider.get()).files)
		} catch (Exception e) {
			out.text += "loom.minecraftJarProvider failed: " + e + "\n"
		}
		// Fallback: whatever merged jar Loom has already produced in its cache.
		fileTree(dir: "${layout.buildDirectory.get()}/loom-cache", include: "**/*.jar").each { jars << it }
		fileTree(dir: "${System.getProperty('user.home')}/.gradle/caches/fabric-loom", include: "**/*merged*.jar").each { jars << it }
		jars = jars.unique { it.absolutePath }
		out.text += "candidate jars:\n"
		jars.each { out.text += "  " + it + " (" + it.length() + " bytes)\n" }
		if (jars.isEmpty()) {
			out.text += "no minecraft jar found; nothing to probe\n"
			return
		}
		def jar = jars.find { it.length() > 1_000_000 } ?: jars[0]
		out.text += "\nprobing " + jar + "\nlist pattern: " + listPattern + "\ndump pattern: " + dumpPattern + "\n"

		def listRe = java.util.regex.Pattern.compile(listPattern, java.util.regex.Pattern.CASE_INSENSITIVE)
		def dumpRe = java.util.regex.Pattern.compile(dumpPattern, java.util.regex.Pattern.CASE_INSENSITIVE)
		def listed = []
		def toDump = []
		new java.util.zip.ZipFile(jar).withCloseable { zip ->
			zip.entries().each { entry ->
				def n = entry.name
				if (!n.endsWith(".class") || n.contains('$')) {
					return
				}
				def fqcn = n.substring(0, n.length() - 6).replace('/', '.')
				if (listRe.matcher(fqcn).find()) {
					listed << fqcn
				}
				if (dumpRe.matcher(fqcn).find()) {
					toDump << fqcn
				}
			}
		}
		listed.sort()
		toDump.sort()
		out.text += "\nmatching classes (" + listed.size() + "):\n"
		listed.each { out.text += "  " + it + "\n" }

		def javap = org.gradle.internal.jvm.Jvm.current().getExecutable("javap").absolutePath
		out.text += "\nsignatures of the first " + Math.min(toDump.size(), 30) + " dump matches:\n"
		toDump.take(30).each { name ->
			def stdout = new ByteArrayOutputStream()
			def result = exec {
				commandLine javap, "-p", "-classpath", jar.absolutePath, name
				standardOutput = stdout
				errorOutput = stdout
				ignoreExitValue = true
			}
			out.text += "\n=== " + name + " (exit " + result.exitValue + ") ===\n" + stdout.toString("UTF-8")
		}
		println "Wrote " + out + " (" + out.length() + " bytes; " + listed.size() + " classes listed)"
	}
}
