plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Mojang mappings. Unlike Yarn these are pulled from Mojang's and Fabric's own
	// repositories (libraries.minecraft.net, maven.fabricmc.net), which Loom adds itself.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MixinExtras supplies @ModifyArgs' Args, @Local and the other sugar used by
	// CameraMixin. compileOnly + annotationProcessor is enough to build against it; the
	// `include` line is what the spec asks for and nests it in the jar. Fabric Loader
	// 0.16+ already bundles MixinExtras, so if the game ever reports a duplicate or a
	// conflicting MixinExtras at runtime, drop the `include` line and keep the other two.
	compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	include "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"

	testImplementation "junit:junit:4.13.2"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["-Xmaxerrs", "2000"])
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnit()
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
