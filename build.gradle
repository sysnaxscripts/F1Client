plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Mojang mappings. Unlike Yarn these are pulled from Mojang's and Fabric's own
	// repositories (libraries.minecraft.net, maven.fabricmc.net), which Loom adds itself.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MixinExtras supplies @ModifyArgs' Args, @Local and the other sugar used by
	// CameraMixin. compileOnly + annotationProcessor is enough to build against it; the
	// `include` line is what the spec asks for and nests it in the jar. Fabric Loader
	// 0.16+ already bundles MixinExtras, so if the game ever reports a duplicate or a
	// conflicting MixinExtras at runtime, drop the `include` line and keep the other two.
	compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	include "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"

	testImplementation "junit:junit:4.13.2"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["-Xmaxerrs", "2000"])
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnit()
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// Development aid: prints the signatures of the mapped classes whose names this mod
// depends on but cannot verify offline. Run `./gradlew probeApi`, optionally with
// -PprobePattern='Gizmo' or -PprobeDumpPattern='Camera', and read build/probe-api.txt.
// CI folds that file into build-report/README.md, which is how the mapping notes in the
// README stay honest. It does not depend on compiling, so it still reports when the build
// is broken.
tasks.register("probeApi") {
	def listPattern = (project.findProperty("probePattern") ?: 'gizmo|debugrender|minecart|levelrenderer').toString()
	// Dumping is limited to a narrow pattern: javap output for every rendering class would
	// be megabytes.
	def dumpPattern = (project.findProperty("probeDumpPattern")
			?: 'ClientboundSound|sounds.SoundManager|client.sounds.SoundEngine|sounds.SoundInstance').toString()
	outputs.upToDateWhen { false }
	doLast {
		def out = layout.buildDirectory.file("probe-api.txt").get().asFile
		def text = new StringBuilder()
		// The compile classpath is exactly what javac saw, so a class that is not listed
		// here genuinely does not exist for this mod.
		def cp = configurations.compileClasspath.files.toList()
		text.append("compile classpath entries: " + cp.size() + "\n")
		cp.findAll { it.name.toLowerCase().contains("minecraft") || it.length() > 5_000_000 }.each {
			text.append("  big/minecraft: " + it.name + " (" + it.length() + " bytes)\n")
		}

		def listRe = java.util.regex.Pattern.compile(listPattern, java.util.regex.Pattern.CASE_INSENSITIVE)
		def dumpRe = java.util.regex.Pattern.compile(dumpPattern, java.util.regex.Pattern.CASE_INSENSITIVE)
		// class name -> jar that contains it
		def found = new java.util.TreeMap<String, File>()
		def dumpTargets = new java.util.TreeMap<String, File>()
		def packages = new java.util.TreeSet<String>()
		cp.each { jar ->
			if (!jar.name.endsWith(".jar") || !jar.exists()) {
				return
			}
			try {
				new java.util.zip.ZipFile(jar).withCloseable { zip ->
					zip.entries().each { entry ->
						def n = entry.name
						if (!n.endsWith(".class")) {
							return
						}
						def fqcn = n.substring(0, n.length() - 6).replace('/', '.')
						if (listRe.matcher(fqcn).find()) {
							found.putIfAbsent(fqcn, jar)
							packages.add(fqcn.contains('.') ? fqcn.substring(0, fqcn.lastIndexOf('.')) : fqcn)
						}
						if (dumpRe.matcher(fqcn).find() && !fqcn.contains('$')) {
							dumpTargets.putIfAbsent(fqcn, jar)
						}
					}
				}
			} catch (Exception e) {
				text.append("  unreadable " + jar.name + ": " + e + "\n")
			}
		}
		text.append("\npackages containing a match (" + packages.size() + "):\n")
		packages.each { text.append("  " + it + "\n") }
		text.append("\nmatching classes (" + found.size() + "):\n")
		found.each { name, jar -> text.append("  " + name + "   [" + jar.name + "]\n") }

		def javap = org.gradle.internal.jvm.Jvm.current().getExecutable("javap").absolutePath
		text.append("\nsignatures of the first " + Math.min(dumpTargets.size(), 25) + " dump matches:\n")
		dumpTargets.take(25).each { name, jar ->
			// ProcessBuilder rather than Project#exec, which Gradle 9 removed.
			def process = new ProcessBuilder(javap, "-p", "-classpath", jar.absolutePath, name)
					.redirectErrorStream(true).start()
			text.append("\n=== " + name + "   [" + jar.name + "] ===\n")
			text.append(process.inputStream.getText("UTF-8"))
			process.waitFor()
		}
		out.text = text.toString()
		println "Wrote " + out + " (" + out.length() + " bytes; " + found.size() + " classes matched)"
	}
}
