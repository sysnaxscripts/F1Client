plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Mojang mappings. Unlike Yarn these are pulled from Mojang's and Fabric's own
	// repositories (libraries.minecraft.net, maven.fabricmc.net), which Loom adds itself.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MixinExtras supplies @ModifyArgs' Args, @Local and the other sugar used by
	// CameraMixin. compileOnly + annotationProcessor is enough to build against it; the
	// `include` line is what the spec asks for and nests it in the jar. Fabric Loader
	// 0.16+ already bundles MixinExtras, so if the game ever reports a duplicate or a
	// conflicting MixinExtras at runtime, drop the `include` line and keep the other two.
	compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	include "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"

	testImplementation "junit:junit:4.13.2"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["-Xmaxerrs", "2000"])
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnit()
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// Development aid: prints the signatures of the mapped Minecraft classes whose names this
// mod depends on but cannot verify offline. Run `./gradlew probeApi` (optionally with
// -PprobePattern='gizmo|minecart') and read build/probe-api.txt. CI folds that file into
// build-report/README.md, which is how the mapping notes in the README stay honest.
tasks.register("probeApi") {
	def pattern = (project.findProperty("probePattern") ?: "gizmo|minecart|Camera|LevelRenderer").toString()
	outputs.upToDateWhen { false }
	dependsOn "compileJava"
	doLast {
		def jarFiles = files(loom.minecraftJarProvider.get()).files.toList()
		def out = layout.buildDirectory.file("probe-api.txt").get().asFile
		out.text = "minecraft jars: " + jarFiles + "\npattern: " + pattern + "\n"
		if (jarFiles.isEmpty()) {
			out.text += "no minecraft jar resolved\n"
			return
		}
		def jar = jarFiles[0]
		def names = []
		new java.util.zip.ZipFile(jar).withCloseable { zip ->
			zip.entries().each { entry ->
				def n = entry.name
				if (n.endsWith(".class") && n.contains(pattern) && !n.contains('$')) {
					names << n.substring(0, n.length() - 6).replace('/', '.')
				}
			}
		}
		names.sort()
		out.text += "matched classes: " + names.size() + "\n"
		names.take(60).each { out.text += "  " + it + "\n" }
		def javap = org.gradle.internal.jvm.Jvm.current().getExecutable("javap").absolutePath
		names.take(40).each { name ->
			def stdout = new ByteArrayOutputStream()
			def result = exec {
				commandLine javap, "-p", "-classpath", jar.absolutePath, name
				standardOutput = stdout
				ignoreExitValue = true
			}
			out.text += "\n=== " + name + " (exit " + result.exitValue + ") ===\n" + stdout.toString("UTF-8")
		}
		println "Wrote " + out + " (" + out.length() + " bytes, " + names.size() + " classes matched)"
	}
}
